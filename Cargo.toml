[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
version = "0.2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.103"
ctrlc = "3.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-util = "0.7"
# ring, not aws-lc-rs: aws-lc-sys is a cmake C build, the slowest unit in a cold build.
# `rustls-no-provider` leaves the provider to bonsai_api::http_client().
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
secrecy = { version = "0.10", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
semver = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "4.6"
terminal_size = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1"
console = { version = "0.16", default-features = false, features = ["std"] }
indicatif = "0.18"
inquire = "0.9"
anstream = "1"
anstyle = "1"
owo-colors = "4"
open = "5"
etcetera = "0.11"
toml = "1"
keyring-core = "1"
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
jsonschema = { version = "0.59", default-features = false, features = ["resolve-file", "idna"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
assert_cmd = "2"
insta = { version = "1", features = ["json", "filters"] }
wiremock = "0.6"
test-case = "3"
tempfile = "3"
predicates = "3"
libc = "0.2"
# The MCP server behind `bonsai mcp`: stdio only, no HTTP transport.
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The profile dist builds the release binaries with.
[profile.dist]
inherits = "release"

[profile.dev.package."*"]
opt-level = 1
