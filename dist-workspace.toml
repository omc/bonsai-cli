[workspace]
members = ["cargo:."]

# Config for 'dist' (https://opensource.axo.dev/cargo-dist/). The workflow in
# .github/workflows/release.yml is generated from this file: run `dist generate`
# after editing it. Written for dist 0.33.0.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
# The run takes the tag as an input and creates it with the GitHub Release, so CI
# tags without a personal token: a tag GITHUB_TOKEN pushes starts no workflow.
dispatch-releases = true
# No run on pull requests. dist's default plans the release on each one, on our own
# runners, and a pull request from a fork brings its own copy of the workflow.
pr-run-mode = "skip"
# GitHub Release only. Homebrew and npm need "homebrew" and "npm" back in `installers`,
# with `tap`, `npm-scope`, `publish-jobs` and the HOMEBREW_TAP_TOKEN and NPM_TOKEN secrets.
installers = ["shell"]
local-artifacts-jobs = ["./ci-green"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
install-path = "CARGO_HOME"
install-updater = true
# Each binary gets a build provenance attestation; check one with
# `gh attestation verify <file> --repo omc/bonsai-cli`. GitHub signs them for public
# repos only on omc's plan (Team), so a release fails here while the repo is private.
github-attestations = true

# dist's default for this target, macos-14, was retired on 2026-11-02. The Linux
# builds run on RunsOn, as in ci.yml (the arm64 one on Graviton); RunsOn has no macOS.
# Their runner reaches the job through dist's build matrix, where `${{ }}` is never
# evaluated, so their RunsOn key is fixed instead of the run ID: two releases at once
# could swap runners, which are the same spec. `global` is written into release.yml
# itself, so it keeps the run ID.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-unknown-linux-musl = "runs-on=bonsai-dist-x64/cpu=4/family=c7i+m7i/image=ubuntu24-full-x64"
aarch64-unknown-linux-musl = "runs-on=bonsai-dist-arm/cpu=4/family=c8g.*/image=ubuntu24-full-arm64"
global = "runs-on=${{ github.run_id }}/cpu=2/family=c7i+m7i/image=ubuntu24-full-x64"

# ci-green reads ci's runs. release.yml grants only `contents` otherwise.
[dist.github-custom-job-permissions]
"ci-green" = { actions = "read" }

# The version of each action dist emits, where dist's default is older.
[dist.github-action-commits]
"actions/checkout" = "v6"
"actions/download-artifact" = "v8"
"actions/upload-artifact" = "v7"
"actions/attest" = "v4"
"actions/setup-node" = "v6"
