[workspace]
members = ["cargo:."]

# Config for 'dist' (https://opensource.axo.dev/cargo-dist/). The workflow in
# .github/workflows/release.yml is generated from this file: run `dist generate`
# after editing it. Written for dist 0.33.0.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "homebrew", "npm"]
tap = "omc/homebrew-tap"
npm-scope = "@omc"
publish-jobs = ["homebrew", "npm"]
local-artifacts-jobs = ["./ci"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
install-path = "CARGO_HOME"
install-updater = true
github-attestations = true

# The version of each action dist emits, where dist's default is older.
[dist.github-action-commits]
"actions/checkout" = "v6"
"actions/download-artifact" = "v8"
"actions/upload-artifact" = "v7"
"actions/attest" = "v4"
"actions/setup-node" = "v6"
