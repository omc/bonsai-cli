# release-plz only opens the release PR (version bump + changelog). `release-plz release` is
# not part of the flow: .github/workflows/release.yml (dist) builds the binaries, creates the
# `v<version>` tag and the GitHub release when it's run. The crates are `publish = false`.
# Only `bonsai` is released, so only it gets a version bump and a changelog.
[workspace]
release = false
git_release_enable = false
publish = false

[[package]]
name = "bonsai"
release = true
git_tag_name = "v{{ version }}"
# The repo root's CHANGELOG.md, where dist also reads the release notes.
changelog_path = "CHANGELOG.md"
