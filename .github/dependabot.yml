# Every ecosystem joins one multi-ecosystem group, so each daily run opens a single
# pull request with every update, major versions included. See
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates

version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: daily

updates:
  - package-ecosystem: cargo
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
