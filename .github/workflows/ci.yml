name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: "runs-on=${{ github.run_id }}-fmt/cpu=2/family=c7i+m7i/image=ubuntu24-full-x64"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: "runs-on=${{ github.run_id }}-clippy/cpu=4/family=c7i+m7i/image=ubuntu24-full-x64/extras=s3-cache"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: clippy
      - uses: runs-on/action@v2
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: [fmt, clippy, deny]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    # Linux runs on RunsOn, macOS stays on GitHub (RunsOn has no macOS). The matrix
    # values stay as they are so the check names do not change.
    runs-on: >-
      ${{ matrix.os == 'macos-15' && 'macos-15' ||
      format('runs-on={0}-test-{1}/cpu=4/family=c7i+m7i/image=ubuntu24-full-x64/extras=s3-cache', github.run_id, strategy.job-index) }}
    env:
      BONSAI_KEYRING: "off"
      # Line numbers are all a failing test's backtrace needs; full debuginfo slows
      # every link and grows the cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - uses: runs-on/action@v2
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace

  deny:
    runs-on: "runs-on=${{ github.run_id }}-deny/cpu=2/family=c7i+m7i/image=ubuntu24-full-x64"
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The release builds static musl binaries (dist-workspace.toml); build them on
  # every PR too, so a musl link problem shows before a release.
  musl:
    needs: [fmt, clippy, deny]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    # Matrix values stay as they are so the check names do not change. The arm64
    # entry runs on Graviton.
    runs-on: >-
      ${{ matrix.runner == 'ubuntu-24.04-arm' &&
      format('runs-on={0}-musl-arm/cpu=4/family=c8g.*/image=ubuntu24-full-arm64/extras=s3-cache', github.run_id) ||
      format('runs-on={0}-musl-x64/cpu=4/family=c7i+m7i/image=ubuntu24-full-x64/extras=s3-cache', github.run_id) }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          targets: ${{ matrix.target }}
      - uses: runs-on/action@v2
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p bonsai --target ${{ matrix.target }}
      # Pointed at a closed local port, so it doesn't call the real API.
      - run: ./target/${{ matrix.target }}/release/bonsai version
        env:
          BONSAI_API_URL: http://127.0.0.1:9/v1

  # Whether this push or PR touches what the nix build reads, for `nix`. A plain
  # diff, not paths-filter, which on a PR needs `pull-requests: read`.
  changes:
    runs-on: "runs-on=${{ github.run_id }}-changes/cpu=2/family=c7i+m7i/image=ubuntu24-full-x64"
    outputs:
      nix: ${{ steps.diff.outputs.nix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has no usable `before`; compare with main.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          if git diff --name-only "$BASE" HEAD -- flake.nix flake.lock Cargo.toml Cargo.lock \
            'crates/*/Cargo.toml' .github/workflows/ci.yml | grep -q .; then
            echo nix=true >> "$GITHUB_OUTPUT"
          fi

  # `nix run github:omc/bonsai-cli` builds flake.nix; check it still builds. It
  # builds every dependency from source, about 8 minutes on a 2-vCPU runner, so it
  # runs only when the build's inputs change and on main, which covers releases.
  nix:
    needs: [fmt, clippy, deny, changes]
    if: >-
      needs.changes.outputs.nix == 'true' ||
      github.ref == 'refs/heads/main'
    runs-on: "runs-on=${{ github.run_id }}-nix/cpu=8/family=c7i+m7i/image=ubuntu24-full-x64"
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix build -L
      - run: ./result/bin/bonsai version
        env:
          BONSAI_API_URL: http://127.0.0.1:9/v1
