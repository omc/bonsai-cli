[package]
name = "bonsai-mcp-tools"
description = "Bonsai's MCP tools, shared by `bonsai mcp` and the hosted MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bonsai-api = { path = "../bonsai-api" }
bonsai-core = { path = "../bonsai-core" }
anyhow.workspace = true
http = "1"
jiff.workspace = true
# No transport: each server brings its own (stdio, or streamable HTTP).
rmcp = { version = "3.9", default-features = false, features = ["server", "macros"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
