[package]
name = "bonsai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Command-line interface for Bonsai"
repository = "https://github.com/omc/bonsai-cli"
homepage = "https://bonsai.io"

[package.metadata.dist]
dist = true

[[bin]]
name = "bonsai"
path = "src/main.rs"

[dependencies]
bonsai-api = { path = "../bonsai-api" }
bonsai-core = { path = "../bonsai-core" }
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
ctrlc.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anstream.workspace = true
owo-colors.workspace = true
terminal_size.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
console.workspace = true
indicatif.workspace = true
inquire.workspace = true
open.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
reqwest.workspace = true
url.workspace = true
semver.workspace = true
rmcp.workspace = true
schemars.workspace = true

[dev-dependencies]
bonsai-contract = { path = "../bonsai-contract" }
bonsai-mock = { path = "../bonsai-mock" }
assert_cmd.workspace = true
predicates.workspace = true
insta.workspace = true
tempfile.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
